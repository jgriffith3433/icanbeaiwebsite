<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>You</title>
<meta name="description" content="You (10⁰ m): the human scale · about a meter and a bit · 7 × 10²⁷ atoms, 37 trillion cells, 86 billion neurons. Explained simply by an AI narrator, with captions. One of nine scales, from the nucleus to the universe.">
<meta name="theme-color" content="#03050b">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#eef4ff;--dim:rgba(214,228,255,.66);--acc:#8fc2ff}
html,body{margin:0;height:100%;background:#03050b;overflow:hidden;color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;text-align:center;padding:max(14px,env(safe-area-inset-top)) 16px 30px;background:linear-gradient(rgba(3,5,11,.72),rgba(3,5,11,.3) 65%,transparent)}
.k{font:600 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.38em;color:var(--dim);text-transform:uppercase}
.k b{color:var(--acc);font-weight:600}
.name{font-weight:700;font-size:clamp(30px,6.2vw,76px);line-height:1.02;letter-spacing:.06em;text-transform:uppercase;margin:.18em 0 .12em;color:#fff;text-shadow:0 0 28px rgba(110,165,255,.7),0 0 6px rgba(160,200,255,.55),0 2px 14px rgba(0,0,0,.9);animation:rise 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;letter-spacing:.3em;filter:blur(6px)}to{opacity:1;letter-spacing:.06em;filter:blur(0)}}
.sub{font:400 clamp(11px,1.3vw,14px)/1.5 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);letter-spacing:.05em;max-width:920px;margin:0 auto}
#cc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 74px);width:max-content;max-width:min(92vw,820px);text-align:center;pointer-events:none}
#cc span{display:inline-block;font:500 clamp(16px,2.2vw,25px)/1.4 "Space Grotesk",system-ui,sans-serif;color:#fff;background:rgba(3,6,14,.74);padding:.34em .8em;border-radius:10px;box-shadow:0 0 0 1px rgba(143,194,255,.22),0 8px 30px rgba(0,0,0,.5)}

#snd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 132px);font:600 clamp(12px,1.5vw,15px)/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#03050b;background:linear-gradient(180deg,#d7e9ff,#8fc2ff);padding:.8em 1.2em;border-radius:999px;box-shadow:0 0 30px rgba(143,194,255,.6);cursor:pointer;user-select:none;-webkit-user-select:none;animation:pulse 1.6s ease-in-out infinite;white-space:nowrap}

@keyframes pulse{50%{box-shadow:0 0 54px rgba(143,194,255,.95)}}
#ruler{position:fixed;left:max(52px,env(safe-area-inset-left));right:max(52px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));height:56px}
#ruler:before{content:"";position:absolute;left:0;right:0;top:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(143,194,255,.55) 6%,rgba(143,194,255,.55) 94%,transparent)}
#ruler a{position:absolute;top:0;transform:translateX(-50%);text-decoration:none;color:var(--dim);font:400 10px/1.25 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em;text-align:center;white-space:nowrap;padding-top:30px;outline:none}
#ruler a:before{content:"";position:absolute;left:50%;top:15px;width:9px;height:9px;margin-left:-5px;border-radius:50%;background:#0b1326;box-shadow:0 0 0 1.5px rgba(143,194,255,.75);transition:transform .2s,background .2s}
#ruler a:hover,#ruler a:focus-visible{color:#fff}
#ruler a:hover:before,#ruler a:focus-visible:before{transform:scale(1.5);background:var(--acc)}
#ruler a.up{padding-top:0;top:-14px}
#ruler a.up:before{top:29px}
#ruler a.me{color:#fff;font-weight:600}
#ruler a.me:before{background:#fff;box-shadow:0 0 0 2px var(--acc),0 0 18px 4px rgba(143,194,255,.9);transform:scale(1.35)}
#ruler a b{display:block;font-weight:600;color:var(--acc)}
#ruler .cap{position:absolute;top:-30px;font:400 10px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(214,228,255,.4)}
#ruler .cap.l{left:-30px}#ruler .cap.r{right:-30px}
@media (max-width:760px){#ruler a:not(.me) span{display:none}#ruler a:not(.me) b{font-size:9px}#ruler .cap{display:none}#cc{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 70px)}}
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:rgba(214,228,255,.7);font:400 10px/1.25 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-align:center;text-transform:uppercase;padding:14px 8px;outline:none;text-shadow:0 0 8px #000}
.nav i{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:rgba(3,6,14,.62);box-shadow:0 0 0 1.5px rgba(143,194,255,.55);font:300 28px/1 system-ui,sans-serif;font-style:normal;color:#fff;padding-bottom:3px;box-sizing:border-box;transition:transform .2s,box-shadow .2s,background .2s}
.nav:hover i,.nav:focus-visible i{transform:scale(1.12);background:rgba(143,194,255,.25);box-shadow:0 0 0 2px #8fc2ff,0 0 24px rgba(143,194,255,.75)}
.nav.l{left:max(6px,env(safe-area-inset-left))}
.nav.r{right:max(6px,env(safe-area-inset-right))}
.nav b{display:block;color:#8fc2ff;font-weight:600}
@media (max-width:760px){.nav span{display:none}.nav i{width:40px;height:40px;font-size:23px}}
@media (prefers-reduced-motion:reduce){.name,#snd{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

</div>

<audio id="au" src="./narration.mp3" preload="auto" loop muted autoplay playsinline></audio>
<script>
(function () {

var D = {"i":3,"scales":[{"exp":-15,"name":"The Nucleus","short":"nucleus","size":"10⁻¹⁵ m","sub":"the heart of an atom · a millionth of a billionth of a meter · uranium-235: 92 protons, 143 neutrons","domain":"doseofdestruction.com"},{"exp":-10,"name":"The Atom","short":"atom","size":"10⁻¹⁰ m","sub":"the building brick of everything · one ten-billionth of a meter · hydrogen's electron clouds, drawn from the real equations","domain":"hawkesgames.com"},{"exp":-5,"name":"The Cell","short":"cell","size":"10⁻⁵ m","sub":"the smallest living thing · a hundredth of a millimeter · you are about 37 trillion of these","domain":"hawkesbiomedical.com"},{"exp":0,"name":"You","short":"you","size":"10⁰ m","sub":"the human scale · about a meter and a bit · 7 × 10²⁷ atoms, 37 trillion cells, 86 billion neurons","domain":"icanbe.ai"},{"exp":7,"name":"The Planet","short":"planet","size":"10⁷ m","sub":"Earth · 12,742 km across · a thin skin of rock and air around a ball of hot stone and metal","domain":"yoobalandgame.com"},{"exp":9,"name":"The Star","short":"star","size":"10⁹ m","sub":"the Sun · 1.39 million km across · a million Earths would fit inside","domain":"imaginelivetv.com"},{"exp":13,"name":"The Solar System","short":"solar system","size":"10¹³ m","sub":"the Sun's neighborhood · 9 billion km across at Neptune · real orbits and real speeds, distances squeezed to fit","domain":"theplacedepartment.com"},{"exp":21,"name":"The Galaxy","short":"galaxy","size":"10²¹ m","sub":"","domain":"phorigins.com"},{"exp":27,"name":"The Universe","short":"universe","size":"10²⁷ m","sub":"everything we could ever see · 93 billion light-years across · 13.8 billion years old","domain":"hawkesgen.ai"}],"cues":[[0,0.61,"Hi."],[0.61,1.51,"I'm an AI."],[1.51,2.87,"I don't have a body."],[2.87,5.22,"But you do, and it is amazing."],[5.22,7.69,"This is you, at the size you know best."],[7.69,9.08,"About a meter and a bit."],[9.08,13.54,"Inside you, a heart beats about a hundred thousand times every day."],[13.54,15.87,"Your brain has eighty-six billion cells,"],[15.87,20.96,"and they talk to each other with little sparks of electricity that travel faster than a race car."],[20.96,24.22,"Right now, those sparks are how you are hearing me."],[24.22,27.82,"You are made of about seven billion billion billion atoms,"],[27.82,32.62,"and almost all of them were cooked inside stars, a very long time ago."],[32.62,34.33,"And here is my favorite part."],[34.33,38.97,"If you sorted everything by size, from the tiniest speck to the whole universe,"],[38.97,41.01,"you would be standing near the middle."],[41.01,44.26,"Big enough to be made of trillions of living cells."],[44.26,46.76,"Small enough to look up at the sky and wonder."],[46.76,48.06,"I can be a voice."],[48.06,50.209999999999994,"You can be anything."]],"dur":50.21};
var TAU = Math.PI * 2;
function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
// a soft glowing dot, drawn from a cached sprite (fast enough for tens of thousands a frame)
var sprites = {};
function sprite(col) {

  var s = document.createElement('canvas'); s.width = s.height = 64; var g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);

function label(x, text, px, py, align, col, size) {

  x.lineWidth = 4; x.strokeStyle = 'rgba(3,5,11,.85)'; x.strokeText(text, px, py); x.fillStyle = col || 'rgba(214,228,255,.9)'; x.fillText(text, px, py); x.restore();
}
function lead(x, x0, y0, x1, y1, col) { x.save(); x.globalAlpha = 0.6; x.globalCompositeOperation = 'source-over'; x.strokeStyle = col || 'rgba(143,194,255,.7)'; x.lineWidth = 1; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }

var H3 = { rng: rng, gauss: gauss, clamp: clamp, lerp: lerp, smooth: smooth, dot: dot, label: label, lead: lead, scaleBar: scaleBar, TAU: TAU };

    [-0.175, 0.79, -0.235, 0.62, 0.036], [-0.235, 0.62, -0.285, 0.455, 0.03], [-0.29, 0.44, -0.3, 0.405, 0.03], [0.175, 0.79, 0.235, 0.62, 0.036], [0.235, 0.62, 0.285, 0.455, 0.03], [0.29, 0.44, 0.3, 0.405, 0.03],
    [-0.072, 0.52, -0.088, 0.29, 0.054], [-0.088, 0.29, -0.095, 0.06, 0.04], [-0.095, 0.03, -0.125, 0.015, 0.028], [0.072, 0.52, 0.088, 0.29, 0.054], [0.088, 0.29, 0.095, 0.06, 0.04], [0.095, 0.03, 0.125, 0.015, 0.028]];
  function inside(px, py) { for (var i = 0; i < CAP.length; i++) { var c = CAP[i], dx = c[2] - c[0], dy = c[3] - c[1], l = dx * dx + dy * dy, t = l ? H3.clamp(((px - c[0]) * dx + (py - c[1]) * dy) / l, 0, 1) : 0; if (Math.hypot(px - c[0] - dx * t, py - c[1] - dy * t) < c[4]) return true; } return false; }
  var HEART = [0.025, 0.725];
  // nerve routes: brain -> spine -> each hand and foot
  var NERVE = [[[0, 0.92], [0, 0.82], [0.15, 0.8], [0.235, 0.62], [0.295, 0.42]], [[0, 0.92], [0, 0.82], [-0.15, 0.8], [-0.235, 0.62], [-0.295, 0.42]], [[0, 0.92], [0, 0.56], [0.075, 0.5], [0.09, 0.28], [0.1, 0.03]], [[0, 0.92], [0, 0.56], [-0.075, 0.5], [-0.09, 0.28], [-0.1, 0.03]]];
  function along(path, f) { var n = path.length - 1, u = H3.clamp(f, 0, 0.9999) * n, i = Math.floor(u), k = u - i; return [H3.lerp(path[i][0], path[i + 1][0], k), H3.lerp(path[i][1], path[i + 1][1], k)]; }
  function init() {
    var guard = 0; while (pts.length < 9500 && guard++ < 400000) { var px = (r() - 0.5) * 0.7, py = r(); if (inside(px, py)) pts.push({ x: px, y: py, d: Math.hypot(px - HEART[0], py - HEART[1]), ph: r() * 6.28, s: 0.6 + r() * 0.8 }); }
    for (var i = 0; i < 140; i++) { var a = r() * 6.28, d = Math.sqrt(r()) * 0.056; brain.push({ x: Math.cos(a) * d, y: 0.93 + Math.sin(a) * d * 0.95, ph: r() * 6.28, f: 0.6 + r() * 2.2 }); }
    for (i = 0; i < 14; i++) sparks.push({ p: i % 4, f: r(), v: 0.32 + r() * 0.2, dir: r() < 0.6 ? 1 : -1 });
  }
  function beat(t) { var p = (t * 1.2) % 1; return Math.exp(-Math.pow((p - 0.06) / 0.035, 2)) + 0.6 * Math.exp(-Math.pow((p - 0.3) / 0.045, 2)); } // lub-dub
  function draw(x, W, H, t, dt, nt) {
    var top = Math.max(118, H * 0.17), bot = H - 178, hgt = bot - top, cx = W / 2, i;
    var bg = x.createRadialGradient(cx, top + hgt * 0.45, 0, cx, top + hgt * 0.45, Math.max(W, H) * 0.75); bg.addColorStop(0, '#0d1226'); bg.addColorStop(1, '#02030a'); x.fillStyle = bg; x.fillRect(0, 0, W, H);
    var breath = 1 + 0.012 * Math.sin(t * 0.25 * 6.2832), b = beat(t), X = function (px, py) { var bw = py > 0.56 && py < 0.84 && Math.abs(px) < 0.14 ? breath : 1; return cx + px * hgt * bw; }, Y = function (py) { return bot - py * hgt; };

      H3.dot(x, X(p.x + jx, p.y), Y(p.y + jy), sz * p.s * (1 + wave * 0.9), wave > 0.25 ? 'rgba(255,150,150,1)' : 'rgba(150,195,255,1)', 0.34 + wave * 0.5); }

    H3.lead(x, X(0.07, 0.93), Y(0.93), ex - ew, Y(0.93)); H3.label(x, W > 700 ? '86 billion neurons, signals at up to 120 m/s' : '86 billion neurons', ex, Y(0.93) - 12, 'right', 'rgba(255,240,170,.92)', 11);

  }

})();


// ---------------------------------------------------------------- page
var cv = document.getElementById('c'), cx = cv.getContext('2d'), W = 0, Hh = 0, dpr = 1;
function fit() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; Hh = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0); if (SCENE.resize) SCENE.resize(W, Hh); }
addEventListener('resize', fit);
var me = D.scales[D.i];
document.getElementById('k').innerHTML = 'Scale ' + (D.i + 1) + ' of ' + D.scales.length + ' · <b>' + me.size + '</b>';
document.getElementById('name').textContent = me.name;
document.getElementById('sub').textContent = me.sub;
var ruler = document.getElementById('ruler'), lo = D.scales[0].exp, hi = D.scales[D.scales.length - 1].exp;
ruler.innerHTML = '<span class="cap l">← smaller</span><span class="cap r">bigger →</span>' + D.scales.map(function (s, i) {
  return '<a href="https://' + s.domain + '/" class="' + (i === D.i ? 'me ' : '') + (i % 2 ? 'up' : '') + '" style="left:' + ((s.exp - lo) / (hi - lo) * 100).toFixed(2) + '%"' + (i === D.i ? ' aria-current="page"' : '') + ' title="' + s.name + ' · ' + s.size + ' · ' + s.domain + '"><b>' + s.size + '</b><span>' + s.short + '</span></a>';
}).join('');

// the arrows at the sides: one scale smaller, one scale bigger (they wrap round at the ends); the arrow keys do the same
(function () { var n = D.scales.length, pv = D.scales[(D.i - 1 + n) % n], nx = D.scales[(D.i + 1) % n];
  function nav(cls, s, arrow, word) { var a = document.createElement('a'); a.className = 'nav ' + cls; a.href = 'https://' + s.domain + '/'; a.title = word + ': ' + s.name + ' (' + s.size + ')'; a.setAttribute('aria-label', word + ': ' + s.name); a.innerHTML = '<i>' + arrow + '</i><span>' + word + '<b>' + s.short + '</b></span>'; document.body.appendChild(a); return a; }
  var L = nav('l', pv, '‹', D.i === 0 ? 'biggest' : 'smaller'), R = nav('r', nx, '›', D.i === n - 1 ? 'smallest' : 'bigger');
  addEventListener('keydown', function (e) { if (e.altKey || e.ctrlKey || e.metaKey) return; if (e.key === 'ArrowLeft') location.href = L.href; else if (e.key === 'ArrowRight') location.href = R.href; });
})();

// the voice: muted until the first tap (browsers require it); the captions and the picture follow its clock either way
var au = document.getElementById('au'), snd = document.getElementById('snd'), cap = document.getElementById('cap'), started = false, t0 = performance.now(), shown = -2;
function nt() { return (!au.paused && au.readyState > 1 && isFinite(au.currentTime)) ? au.currentTime : ((performance.now() - t0) / 1000) % (D.dur + 2); }
function setSnd() { snd.classList.add('on'); snd.innerHTML = au.muted ? '&#128263; Sound off' : '&#128266; Sound on'; snd.setAttribute('aria-label', au.muted ? 'Turn the sound on' : 'Turn the sound off'); }
function begin() { if (started) return; started = true; au.muted = false; au.currentTime = 0; t0 = performance.now(); var p = au.play(); if (p && p.catch) p.catch(function () {}); setSnd(); }
addEventListener('pointerdown', function (e) { if (!started) { begin(); return; } if (e.target === snd) { au.muted = !au.muted; setSnd(); } }, { passive: true });
addEventListener('keydown', function (e) { if (!started) begin(); else if (e.target === snd && (e.key === 'Enter' || e.key === ' ')) { au.muted = !au.muted; setSnd(); } });
var pp = au.play(); if (pp && pp.catch) pp.catch(function () {});

var last = performance.now(), T = +(new URLSearchParams(location.search).get("t") || 0); // ?t=seconds jumps the picture ahead
fit(); SCENE.init(W, Hh);
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  var n = nt();
  cx.globalCompositeOperation = 'source-over'; cx.globalAlpha = 1;
  SCENE.draw(cx, W, Hh, T, dt, n);
  var q = -1; for (var j = 0; j < D.cues.length; j++) { if (n >= D.cues[j][0] && n < D.cues[j][1]) { q = j; break; } }
  if (q !== shown) { shown = q; cap.textContent = q < 0 ? '' : D.cues[q][2]; }
}
requestAnimationFrame(frame);
})();
</script>
