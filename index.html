})({"bg":"#090d12","fg":"#e9eff6","dim":"#6c7c8d","rule":"#232c36","a":"#7fe0ff","b":"#ffd36b","a3":[127,224,255],"b3":[255,211,107],"bg3":[9,13,18]}, {"mono":"ui-monospace,SFMono-Regular,Menlo,Consolas,monospace","serif":"Georgia,\"Times New Roman\",serif","sans":"system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif"}, function wires(P, F) {
