        var h = location.hostname;

          /^(10|192\.168)\./.test(h) || /^172\.(1[6-9]|2\d|3[01])\./.test(h) || /\.local$/.test(h);

    <!-- Hawkes Analytics (AGENTS.md "Analytics"). The build is written by scripts/stamp-build.mjs. -->

    <script>
      /* A playtest bot's tab logs what it sends (the SDK's debug mode), so the playtest can show the events going out. */
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          if ((navigator.webdriver || q.get("playtest")) && !q.get("hawkes-analytics-debug")) {
            q.set("hawkes-analytics-debug", "1");
            history.replaceState(history.state, "", location.pathname + "?" + q.toString() + location.hash);
          }
        } catch (e) {}
      })();

  <body>
    <canvas id="view" aria-label="A 3D view of Small Weather's day"></canvas>

    <header class="hud top">
      <section class="panel now" aria-live="polite">
        <p class="mark">
          <span id="mark-title">I can be</span>
          <span class="sep">·</span>
          <span class="chapter" id="chapter">–</span>
          <span class="sep">·</span>
          <span id="where">–</span>
        </p>
        <h1 class="time"><span id="time">–</span><small id="ampm"></small></h1>
        <p class="what" id="what">The day is starting.</p>
        <div class="progress" aria-hidden="true"><i id="prog"></i></div>
        <p class="next" id="next"></p>
      </section>
      <div class="tools">
        <button type="button" id="sound" aria-pressed="false">Sound off</button>
        <button type="button" id="details" aria-pressed="true">Details</button>
      </div>
    </header>

    <aside class="panel side" id="side">
      <section>
        <h2 id="log-title">Every action</h2>
        <ol class="log" id="log"></ol>
      </section>
      <section>
        <h2>Body</h2>
        <div class="meters" id="meters"></div>
      </section>
      <section>
        <h2>Things</h2>
        <div class="chips" id="things"></div>
      </section>
      <p class="foot">Edit <code>day.config.js</code> to change the day. <a href="privacy.html">Privacy</a></p>
    </aside>

    <footer class="hud bottom panel">
      <div class="controls">
        <button type="button" id="live" class="live" aria-pressed="true">● Live</button>
        <button type="button" id="play">Pause</button>
        <div class="speeds" id="speeds" role="group" aria-label="Playback speed"></div>
        <span class="spacer"></span>
        <span class="date" id="date"></span>
        <span class="count" id="count"></span>
      </div>
      <div class="daybar">
        <div class="segs" id="segs"></div>
        <div class="marker" aria-hidden="true"></div>
        <label class="sr" for="scrub">Time of day</label>
        <input id="scrub" type="range" min="450" max="1889.99" step="0.05" value="450" />
        <div class="ticks" id="ticks" aria-hidden="true"></div>
      </div>
    </footer>

    <div class="errors" id="errors" hidden></div>

    <!-- The version (releases.json, written at each release): a quiet link to What's new, also in the public view. -->
    <a class="version-tag" href="whatsnew.html" data-hawkes-version hidden></a>
    <!-- Anonymous viewing statistics (Hawkes Analytics): what is collected is on privacy.html. -->
    <a class="privacy-tag" href="privacy.html">Privacy</a>

    <!-- Local only: preview the page the way the public sees it (no HUD). Shortcut: H -->
    <button type="button" class="public-toggle" id="public-toggle" aria-pressed="false" title="Preview the public view (H)">Public view</button>
    <script>
      (function () {
        var root = document.documentElement;
        var btn = document.getElementById("public-toggle");
        if (root.classList.contains("public")) return;
        function set(on) {
          root.classList.toggle("preview-public", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
          btn.textContent = on ? "Show HUD" : "Public view";
          try { localStorage.setItem("previewPublic", on ? "1" : "0"); } catch (e) {}
        }
        var saved = false;
        try {
          var q = new URLSearchParams(location.search);
          if (!navigator.webdriver && !q.get("playtest")) saved = localStorage.getItem("previewPublic") === "1";
        } catch (e) {}
        set(saved);
        btn.addEventListener("click", function () { set(!root.classList.contains("preview-public")); });
        window.addEventListener("keydown", function (e) {
          if ((e.key === "h" || e.key === "H") && !(e.target && e.target.tagName === "INPUT")) set(!root.classList.contains("preview-public"));
        });
      })();
    </script>

    <!-- Babylon.js 9 and Havok physics from npm, the day, the world, the page and analytics: bundled by Vite (js/app.js). -->
    <script type="module" src="js/app.js?v=f2bd9ac1bc"></script>
