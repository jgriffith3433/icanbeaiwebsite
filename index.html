// Talking to the page. A visitor types or speaks a question; the answer comes back as text and is read aloud in the
// voice of the side they are on. The server (D.chat) is told which scale and which side, so the page knows what it is
// showing. Replies are spoken with the browser's own voice (a different one on the back of the page).

  var btn = mk('button', 'askb', ''); btn.type = 'button';
  var box = mk('section', 'ask', '<header><div><b id="askwho"></b><span id="askon"></span></div><button type="button" id="askv"></button><button type="button" id="askx" aria-label="Close" title="Close">&times;</button></header><div id="asklog" role="log" aria-live="polite"></div><div id="askchips"></div><form id="askf"><button type="button" id="askm" aria-label="Ask by voice" title="Ask by voice">&#127908;</button><input id="aski" maxlength="400" autocomplete="off" enterkeyhint="send"><button id="asks" aria-label="Send" title="Send">&uarr;</button></form>');

  function now() { return CH.side() ? back() : front(); }

  function setVoice() { vB.innerHTML = voice ? '&#128266;' : '&#128263;'; vB.className = voice ? '' : 'off'; vB.title = voice ? 'Answers are read aloud. Tap to turn that off.' : 'Answers are silent. Tap to hear them.'; vB.setAttribute('aria-label', vB.title); }

    $('askwho').textContent = 'The A.I. on this page'; $('askon').textContent = (s ? 'the back: ' : 'the front: ') + lc;
    inp.placeholder = 'Ask about ' + lc + '…';
    var qs = s ? ['What am I looking at?', 'Why is this the opposite?', 'Is that known for sure?'] : ['What am I looking at?', 'How big is it, really?', 'What is its opposite?'];
    chips.innerHTML = ''; qs.forEach(function (q) { var b = doc.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = function () { send(q); }; chips.appendChild(b); });
    if (!isOpen()) return;
    if (lastSide >= 0 && lastSide !== s) add('', (s ? 'you turned the page: now ' : 'you turned back: now ') + lc, 'i');
    if (!greeted[s]) {
      greeted[s] = true;
      add('ai', s ? 'Hello from the other side. As far as I can tell, you are now looking at ' + lc + ', which this page calls the opposite of ' + front().toLowerCase() + '. I find it a bit strange too. What are you wondering?'
        : 'Hi. I am the A.I. on this page. From what I can tell, you are looking at ' + lc + '. I do not know everything about it, but I like working it out. What would you like to know?');
