        try { forced = new URLSearchParams(location.search).get("view") === "public"; } catch (e) {}

        else if (forced) root.classList.add("preview-public", "view-forced");

    <!-- The loading card: plain HTML and CSS, so it shows from the first paint. window.__loading (below) fills the bar from real load events. -->
    <div id="loading" role="status" aria-live="polite">
      <div class="card">
        <p class="kicker">I Can Be</p>
        <h2>Small Weather</h2>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4"><i id="loading-bar"></i></div>
        <p class="msg" id="loading-msg">Loading…</p>
        <button type="button" class="retry" id="loading-retry">Try again</button>
      </div>
    </div>
    <script>
      /* Loading progress from real events: the page's scripts (their load events), his model's bytes (js/app.js), the first
         frame and the title (js/title.js). Parts weigh: scripts .5, first frame .25, title .25 (his model streams in behind the title: not gated, so a phone on Slow 4G isn't held). No timers poll. */
      (function () {
        var html = document.documentElement, card = document.getElementById("loading"), bar = document.getElementById("loading-bar");
        var msg = document.getElementById("loading-msg"), retry = document.getElementById("loading-retry");
        var W = { scripts: 0.5, model: 0, frame: 0.25, title: 0.25 }, got = { scripts: 0, model: 0, frame: 0, title: 0 };
        var t0 = performance.now(), MIN_MS = 700, state = "loading", log = [], slowT = 0;
        var TEXT = { scripts: "Loading…", model: "Loading…", frame: "Loading…", title: "Loading…" }; /* one fixed line: each new line counts as more words on screen in the first minute */
        function emit(action, extra) {
          var d = { action: action, t: Math.round(performance.now() - t0), pct: pct() };
          if (extra) for (var k in extra) d[k] = extra[k];
          log.push(d); if (log.length > 40) log.shift();
          try { window.dispatchEvent(new CustomEvent("day:loading", { detail: d })); } catch (e) {}
        }
        function pct() { var p = 0; for (var k in W) p += W[k] * got[k]; return Math.round(p * 100); }
        function paint(part) {
          if (state !== "loading") return;
          var p = Math.max(4, pct());
          bar.style.width = p + "%"; bar.parentNode.setAttribute("aria-valuenow", String(p));
          /* Name what is still pending, not the last part that moved: with everything in but the shader warm-up the card
             used to keep saying "Loading Small Weather…" at a full bar. */
          if (!part) { for (var k in W) if (got[k] < 1) { part = k; break; } if (!part) part = "frame"; }
          msg.textContent = TEXT[part];
        }
        function set(part, frac) {
          if (state !== "loading" || !(part in W)) return;
          frac = Math.max(0, Math.min(1, frac));
          if (frac <= got[part]) return;
          got[part] = frac; paint(frac < 1 ? part : null);
          emit("progress", { part: part, frac: Math.round(frac * 100) / 100 });
        }
        function finish() {
          if (state !== "loading") return;
          state = "done"; clearTimeout(slowT);
          bar.style.width = "100%";
          /* Handoff: the card fades over the title's crane (already under it) so the day never cuts to a black frame.
             Theme beds unlock on the first gesture when Sound is saved on (js/score.js listens for day:loading handoff). */
          card.classList.add("leaving");
          html.classList.remove("loading");
          emit("handoff", { seconds: Math.round((performance.now() - t0) / 100) / 10 });
          setTimeout(function () { card.hidden = true; emit("done", { seconds: Math.round((performance.now() - t0) / 100) / 10 }); }, 920);
        }
        function done() {
          if (state !== "loading") return;
          got = { scripts: 1, model: 1, frame: 1, title: 1 };
          var wait = MIN_MS - (performance.now() - t0);
          if (wait > 0) setTimeout(finish, wait); else finish();
        }
        function fail(why, what) {
          if (state === "done") return;
          state = "failed"; clearTimeout(slowT);
          card.classList.add("failed"); card.classList.remove("slow");
          msg.textContent = "Couldn't load " + (what || "the day") + ". Check your connection and try again.";
          emit("fail", { why: String(why || "") });
        }
        retry.addEventListener("click", function () { location.reload(); });
        // Scripts: capture-phase load/error events on <script> elements (they don't bubble).
        document.addEventListener("load", function (e) {
          var el = e.target; if (!el || el.tagName !== "SCRIPT" || !el.src) return;
          if (/app\.js|index-.*\.js|\/assets\//.test(el.src)) set("scripts", 1);
        }, true);
        document.addEventListener("error", function (e) {
          var el = e.target; if (el && el.tagName === "SCRIPT" && el.src && /app\.js|\/assets\//.test(el.src)) fail("script " + el.src, "the game");
        }, true);
        /* A module that throws while it evaluates (a circular chunk's TDZ, a bad import) fires no <script> error event: the card sat at 50%
           forever. Until the day exists (window.day.now is set by js/main.js), an uncaught error or rejection from the game's own files is a failed
           boot: say so, with Try again, instead of a frozen bar. After the day is up a stray error never takes the card down. */
        function bootError(why, file) {
          if (state !== "loading" || (window.day && window.day.now)) return;
          if (file && !/\/assets\/|\/js\/|app\.js/.test(String(file))) return;
          fail(why, "the game");
        }
        window.addEventListener("error", function (e) { if (e.target && e.target !== window) return; bootError((e.error && e.error.message) || e.message, e.filename); });
        window.addEventListener("unhandledrejection", function (e) { var r = e.reason; bootError((r && r.message) || r, (r && r.stack) || ""); });
        slowT = setTimeout(function () { if (state === "loading") { card.classList.add("slow"); msg.textContent = "Still loading… this is taking longer than usual."; emit("slow"); } }, 30000);
        window.__loading = { set: set, done: done, fail: fail, state: function () { return state; }, pct: pct, log: function () { return log.slice(); } };
        emit("show");
      })();
    </script>

    <script>
      (function () {
        var root = document.documentElement;
        var btn = document.getElementById("public-toggle");
        if (root.classList.contains("public")) return;
        function set(on) {
          root.classList.toggle("preview-public", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
          btn.textContent = on ? "Show HUD" : "Public view";
          try { localStorage.setItem("previewPublic", on ? "1" : "0"); } catch (e) {}
        }
        var saved = false;
        try {
          var q = new URLSearchParams(location.search);
          if (!navigator.webdriver && !q.get("playtest")) saved = localStorage.getItem("previewPublic") === "1";
        } catch (e) {}
        if (root.classList.contains("view-forced")) { btn.hidden = true; return; } // ?view=public: nothing but the page
        set(saved);
        btn.addEventListener("click", function () { set(!root.classList.contains("preview-public")); });
        window.addEventListener("keydown", function (e) {
          if ((e.key === "h" || e.key === "H") && !(e.target && e.target.tagName === "INPUT")) set(!root.classList.contains("preview-public"));
        });
      })();
