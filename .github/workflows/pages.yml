# Builds the site with Vite and publishes it to GitHub Pages.
# The page imports Babylon.js 9 and Havok from npm, which Pages can't serve from the source, so it deploys the built
# dist/ (vite.config.js copies the static pages, releases.json and the CNAME into it). Needs Settings > Pages > Source
# set to "GitHub Actions": Hawkes Studio switches it the first time this file reaches main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The tests run but no longer stop the site going live (J, 2026-11-14: "Skip the tests and just go live asap").
      # They were failing on main before this. Remove continue-on-error once they pass again.
      - run: npm test
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
